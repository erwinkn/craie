[package]
name = "craie-harness"
description = "Verification harness: incremental-equals-clean-rebuild, cost invariants, release-graph checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dev-only. Reference libraries enter here (never in release crates);
# `tests/release_graph.rs` asserts release graphs stay clean.
[dependencies]
craie-core.workspace = true
craie-scene.workspace = true
# Pinned fonts: every harness Ui lays text out on assets/fonts.
craie-text = { workspace = true, features = ["pinned-fonts"] }
craie-render.workspace = true
wgpu.workspace = true
craie-ui.workspace = true
taffy.workspace = true
accesskit.workspace = true
# E01 oracle: Parley over the pinned fonts.
parley.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# E01 reference for hard breaks (UAX #14).
unicode-linebreak.workspace = true
