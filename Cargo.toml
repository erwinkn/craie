[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/scene",
    "crates/render",
    "crates/text",
    "crates/ui",
    "crates/platform-winit",
    "crates/node",
    "harness/invariants",
]
# craie-node is an N-API cdylib: it links only inside Node, so plain
# `cargo test` leaves it out.
default-members = [
    "crates/core",
    "crates/scene",
    "crates/render",
    "crates/text",
    "crates/ui",
    "crates/platform-winit",
    "harness/invariants",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/erwinkn/craie"

[workspace.dependencies]
craie-core = { path = "crates/core" }
craie-scene = { path = "crates/scene" }
craie-render = { path = "crates/render" }
craie-text = { path = "crates/text" }
craie-ui = { path = "crates/ui" }
craie-platform-winit = { path = "crates/platform-winit" }
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "content_size"] }
arboard = "3.6.1"
png = "=0.18.1"
winit = "=0.30.13"
wgpu = "=30.0.1"
parley = "=0.11.1"
swash = "=0.2.10"
etagere = "=0.3.0"
accesskit = "=0.25.0"
accesskit_winit = "=0.34.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
tracing = "=0.1.44"

[profile.dev]
# Debug text shaping is painful; keep deps fast even in dev builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
