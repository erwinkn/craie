# scripts/ci.sh, then the windowed smoke test under Xvfb, on Linux.
# wgpu runs on Mesa's lavapipe (software Vulkan) with the validation
# layer, as on the dev VM; CRAIE_REQUIRE_GPU turns a missing adapter
# into a failure instead of skipped GPU tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CRAIE_REQUIRE_GPU: 1

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-validationlayers \
            xvfb libxkbcommon-x11-0 libfontconfig-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile

      - run: scripts/ci.sh

      - name: Smoke (windowed, Xvfb)
        timeout-minutes: 10
        run: xvfb-run -a pnpm smoke
